---
name: Integration tests

'on':
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"
    branches:
      - "ci-*"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  merge_group:
  schedule:
    - cron: '0 2 * * *'   # daily @ 02h00 (non-critical)
    - cron: '0 12 * * 6'  # weekly - Saturday @ noon (long-running)
  workflow_dispatch:
    inputs:
      ci_baselayer:
        type: boolean
        default: true
        description: 'run ci on baselayer'
      ci_ffi:
        type: boolean
        default: true
        description: 'run ci on ffi'
      ci_profile:
        default: ci
        description: 'ci profile to run'
        type: string

env:
  toolchain: nightly-2024-07-07
  ci_baselayer: ${{ github.event.inputs.ci_baselayer || 'true' }}
  ci_ffi: ${{ github.event.inputs.ci_ffi || 'true' }}
  ci_profile: ${{ github.event.inputs.ci_profile || 'ci' }}

concurrency:
  # https://docs.github.com/en/actions/examples/using-concurrency-expressions-and-a-test-matrix
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') || github.ref != 'refs/heads/development' || github.ref != 'refs/heads/nextnet' || github.ref != 'refs/heads/stagenet' }}

permissions: {}

jobs:
  cucumber:
    name: Cucumber tests / ${{ matrix.cucumber_test }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cucumber_test: baselayer
            args: "(not @wallet-ffi) and (not @chat-ffi)"
            arg_c: 5
          - cucumber_test: ffi
            args: "(@wallet-ffi or @chat-ffi)"
            arg_c: 1

    # runs-on: [self-hosted, ubuntu-high-cpu]
    runs-on: [ubuntu-latest]

    steps:
      - name: Envs setup
        id: envs_setup
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "schedule" ] ; then
            echo "CI_FFI=false" >> $GITHUB_OUTPUT
            if [ "${{ github.event.schedule }}" == "0 2 * * *" ] ; then
              echo "CI_PROFILE=(not @long-running)" >> $GITHUB_OUTPUT
            elif [ "${{ github.event.schedule }}" == "0 12 * * 6" ] ; then
              echo "CI_PROFILE=@long-running" >> $GITHUB_OUTPUT
            fi
          else
            echo "CI ..."
            echo "CI_PROFILE=@critical and (not @long-running)" >> $GITHUB_OUTPUT
            CI_BASELAYER=${{ inputs.ci_baselayer }}
            echo "Run binary - ${CI_BASELAYER}"
            echo "CI_BASELAYER=${CI_BASELAYER:-true}" >> $GITHUB_OUTPUT
            CI_FFI=${{ inputs.ci_ffi }}
            echo "Run FFI - ${CI_FFI}"
            echo "CI_FFI=${CI_FFI:-true}" >> $GITHUB_OUTPUT
          fi

      - name: checkout
        uses: actions/checkout@v4

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
          toolchain: ${{ env.toolchain }}

      - name: Install ubuntu dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo bash scripts/install_ubuntu_dependencies.sh

      - name: GH Cache cargo files and outputs
        if: startsWith(runner.environment,'github-hosted')
        uses: swatinem/rust-cache@v2

      - name: SH Caching cargo files and outputs (nightly)
        if: startsWith(runner.environment,'self-hosted')
        # Don't use rust-cache.
        # Rust-cache disables a key feature of actions/cache: restoreKeys.
        # Without restore keys, we lose the ability to get partial matches on caches, and end
        # up with too many cache misses.
        # This job runs on self-hosted, so use local-cache instead.
        uses: maxnowack/local-cache@v2
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/CACHEDIR.TAG
            ~/.cargo/git
            target
          key: tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}-nightly-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}-nightly-${{ hashFiles('**/Cargo.lock') }}
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}-nightly

      - name: cargo test compile
        run: |
          cargo test --no-run --locked \
            --all-features --release

      - name: Run ${{ env.CI_PROFILE }} CI for ${{ matrix.cucumber_test }}
        timeout-minutes: 90
        run: |
          cargo test \
            --test cucumber \
            -v \
            --all-features \
            --release \
            --package tari_integration_tests \
            -- -t "${{ env.CI_PROFILE }} and ${{ matrix.args }} and (not @broken)" \
            -c ${{ matrix.arg_c }} \
            --retry 2

      - name: upload artifact
        uses: actions/upload-artifact@v4  # upload test results as artifact
        if: always()
        with:
          name: test-results-junit-${{ matrix.cucumber_test }}-cucumber
          path: ${{ github.workspace }}/integration_tests/cucumber-output-junit.xml

  # needed for test results
  event_file:
    name: "Upload Event File for Test Results"
    runs-on: [ubuntu-latest]
    steps:
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Event File
          path: ${{ github.event_path }}
